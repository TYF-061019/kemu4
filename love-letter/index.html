                            linear-gradient(135deg, #ffe0ec 0%, #ffc0cb 50%, #ff9a9e 100%);
                background-blend-mode: overlay;
                min-height: 100vh;
            }
        }

        /* 漂浮爱心动画 */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            opacity: 0;
            animation: floatUp 6s linear infinite;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-20vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            width: 90%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(255, 105, 135, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            text-align: center;
            margin: 20px;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 标题装饰爱心 */
        .title-heart {
            font-size: 48px;
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.2);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.15);
            }
        }

        h1 {
            color: #d6336c;
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .letter {
            color: #5a3a4a;
            font-size: 17px;
            line-height: 2;
            text-align: left;
            margin-bottom: 35px;
            white-space: pre-line;
        }

        .letter p {
            margin-bottom: 12px;
        }

        .signature {
            text-align: right;
            color: #d6336c;
            font-style: italic;
            margin-top: 10px;
        }

        /* 关键问题 */
        .question {
            color: #d6336c;
            font-size: 24px;
            font-weight: 700;
            margin: 30px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 5px rgba(214, 51, 108, 0.3);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(214, 51, 108, 0.6);
            }
        }

        /* 按钮区域 */
        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 30px;
            position: relative;
            min-height: 80px;
        }

        .btn {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 50px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        /* 愿意按钮 - 会变大 */
        .btn-yes {
            background: linear-gradient(135deg, #ff4d6d 0%, #ff8fa3 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
            transform: scale(1);
        }

        .btn-yes:hover {
            transform: scale(1.3) rotate(-2deg);
            box-shadow: 0 15px 40px rgba(255, 77, 109, 0.7),
                        0 0 30px rgba(255, 105, 135, 0.8);
            background: linear-gradient(135deg, #ff1e56 0%, #ff6b8a 100%);
        }

        .btn-yes:active {
            transform: scale(1.25);
        }

        /* 不愿意按钮 - 会逃跑 */
        .btn-no {
            background: linear-gradient(135deg, #c0c0c0 0%, #e0e0e0 100%);
            color: #888;
            box-shadow: 0 4px 15px rgba(150, 150, 150, 0.3);
            position: relative;
        }

        .btn-no:hover {
            background: linear-gradient(135deg, #c0c0c0 0%, #e0e0e0 100%);
            color: #888;
        }

        /* 成功页面 */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 245, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.6s ease-out;
        }

        .success-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .success-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-heart {
            font-size: 100px;
            animation: bigHeartbeat 1s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bigHeartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .success-title {
            color: #d6336c;
            font-size: 42px;
            margin: 20px 0;
            font-weight: 700;
        }

        .success-text {
            color: #5a3a4a;
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* 庆祝爱心飘落 */
        .celebration-heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 99;
            animation: fallDown 3s linear forwards;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.5;
            }
        }

        /* 平板适配 */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 15px;
            }

            h1 {
                font-size: 28px;
            }

            .letter {
                font-size: 16px;
            }
        }

        /* 手机适配 */
        @media (max-width: 480px) {
            .container {
                padding: 35px 22px;
                margin: 12px;
                border-radius: 20px;
            }

            .title-heart {
                font-size: 40px;
            }

            h1 {
                font-size: 24px;
                letter-spacing: 1px;
                margin-bottom: 22px;
            }

            .letter {
                font-size: 15px;
                line-height: 1.9;
                margin-bottom: 28px;
            }

            .letter p {
                margin-bottom: 10px;
            }

            .question {
                font-size: 20px;
                margin: 24px 0;
            }

            .btn {
                padding: 16px 38px;
                font-size: 17px;
            }

            .buttons {
                gap: 18px;
                min-height: 70px;
            }

            .success-title {
                font-size: 30px;
            }

            .success-text {
                font-size: 17px;
            }

            .success-heart {
                font-size: 80px;
            }

            .success-content {
                padding: 25px;
            }
        }

        /* 超小屏幕适配 */
        @media (max-width: 360px) {
            .container {
                padding: 28px 18px;
            }

            h1 {
                font-size: 22px;
            }

            .letter {
                font-size: 14px;
            }

            .question {
                font-size: 18px;
            }

            .btn {
                padding: 14px 30px;
                font-size: 16px;
            }
        }

        /* 横屏适配 */
        @media (max-width: 768px) and (orientation: landscape) and (max-height: 480px) {
            .container {
                margin: 10px;
                padding: 25px 30px;
            }

            .title-heart {
                font-size: 32px;
                margin-bottom: 5px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .letter {
                font-size: 14px;
                line-height: 1.7;
                margin-bottom: 18px;
            }

            .letter p {
                margin-bottom: 6px;
            }

            .question {
                font-size: 18px;
                margin: 18px 0;
            }

            .btn {
                padding: 12px 32px;
                font-size: 16px;
            }
        }

        /* 适配微信内置浏览器底部工具栏 */
        @supports (padding: max(0px)) {
            .container {
                padding-bottom: max(40px, env(safe-area-inset-bottom));
            }
        }

        /* 微信 X5 内核兼容 */
        @media all and (-webkit-min-device-pixel-ratio: 0) and (min-resolution: 0.001dpcm) {
            body {
                -webkit-text-size-adjust: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 漂浮爱心背景 -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- 告白信主体 -->
    <div class="container">
        <div class="title-heart">💖</div>
        <h1>致最可爱的你</h1>

        <div class="letter">
            <p>嘿，不知道你有没有发现，每次你不经意地笑起来，我的世界就亮了一整个下午。</p>
            <p>遇见你之前，我以为喜欢一个人是轰轰烈烈的事；遇见你之后，我才知道，喜欢一个人是悄悄地、甜甜地、想把你藏进每一天里。</p>
            <p>想和你一起看日出日落，想和你一起走过春夏秋冬，想在你难过时第一个抱住你，想在你开心时陪你笑得没心没肺。</p>
            <p>余生很长，我不想和别人，只想和你，慢慢走。</p>
            <p class="signature">—— 一个偷偷喜欢你很久的人</p>
        </div>

        <div class="question">那么，你愿意做我的女朋友吗？</div>

        <div class="buttons" id="buttons">
            <button class="btn btn-yes" id="btnYes" onclick="sayYes()">我愿意 ❤️</button>
            <button class="btn btn-no" id="btnNo" onclick="runAway(this)">不愿意</button>
        </div>
    </div>

    <!-- 成功页面 -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-heart">💗</div>
            <h2 class="success-title">太好了！</h2>
            <p class="success-text">
                从此以后，你就是我心里最重要的那一个人。<br>
                我会牵着你的手，<br>
                把所有的温柔和偏爱，都给你一个人。<br>
                余生请多指教，我的女孩 💕
            </p>
            <div style="font-size: 40px;">🥰</div>
        </div>
    </div>

    <script>
        // 漂浮爱心动画
        const hearts = ['❤️', '💖', '💗', '💕', '💘', '🌹', '💝'];
        const floatingContainer = document.getElementById('floatingHearts');

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (16 + Math.random() * 20) + 'px';
            heart.style.animationDuration = (5 + Math.random() * 4) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            floatingContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 10000);
        }

        // 持续生成漂浮爱心
        setInterval(createFloatingHeart, 600);
        // 初始多生成几个
        for (let i = 0; i < 8; i++) {
            setTimeout(createFloatingHeart, i * 200);
        }

        // 是否为触屏设备
        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

        // 不愿意按钮逃跑逻辑
        function runAway(btn) {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const btnRect = btn.getBoundingClientRect();

            // 按钮尺寸
            const btnW = btnRect.width || 120;
            const btnH = btnRect.height || 50;

            // 随机移动到一个新位置（避开屏幕边缘和微信浏览器顶部/底部工具栏）
            const margin = 20;
            const maxX = Math.max(containerWidth - btnW - margin * 2, margin);
            const maxY = Math.max(containerHeight - btnH - margin * 2 - 100, margin);
            const newX = Math.random() * maxX + margin;
            const newY = Math.random() * maxY + margin + 50;

            btn.style.position = 'fixed';
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
            btn.style.zIndex = '50';
            btn.style.transition = 'left 0.25s ease-out, top 0.25s ease-out, transform 0.25s ease-out';
            btn.style.transform = `rotate(${(Math.random() - 0.5) * 25}deg)`;

            // 偶尔改变按钮文字，增加趣味
            const messages = ['不愿意', '真的吗？', '再想想嘛~', '别点我啦', '点另一个啦', '不要嘛'];
            btn.textContent = messages[Math.floor(Math.random() * messages.length)];
        }

        // 愿意按钮点击逻辑
        function sayYes() {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');

            // 撒爱心庆祝
            const celebrationHearts = ['❤️', '💖', '💗', '💕', '💘', '🌹', '💝', '🎉', '✨', '🥰'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'celebration-heart';
                    heart.textContent = celebrationHearts[Math.floor(Math.random() * celebrationHearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (2 + Math.random() * 2) + 's';
                    heart.style.fontSize = (20 + Math.random() * 25) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 100);
            }
        }

        // 给不愿意按钮绑定事件（兼容触屏和鼠标）
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');

        // 鼠标 hover 逃跑（PC端）
        btnNo.addEventListener('mouseenter', function(e) {
            if (!isTouchDevice) {
                runAway(this);
            }
        });

        // 触屏靠近逃跑（手机端：手指即将碰到时逃跑）
        // 用 touchstart 实现"点上去没用"——手指一碰就跑
        btnNo.addEventListener('touchstart', function(e) {
            e.preventDefault(); // 阻止默认点击行为
            runAway(this);
        }, { passive: false });

        // 防止触屏上 click 触发
        btnNo.addEventListener('click', function(e) {
            if (isTouchDevice) {
                e.preventDefault();
                runAway(this);
            }
        });

        // 愿意按钮：手机上点击也会"变大"反馈
        btnYes.addEventListener('touchstart', function(e) {
            // 让触屏端也能体验按钮变大效果
            this.style.transform = 'scale(1.25) rotate(-2deg)';
            this.style.boxShadow = '0 15px 40px rgba(255, 77, 109, 0.7), 0 0 30px rgba(255, 105, 135, 0.8)';
        }, { passive: true });

        btnYes.addEventListener('touchend', function(e) {
            // 触屏释放后短暂保留大尺寸，营造"愿意按钮变大了"的视觉
            setTimeout(() => {
                this.style.transform = '';
                this.style.boxShadow = '';
            }, 300);
        });

        // 防止页面在 iOS 微信中随双指缩放
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // 禁止双击放大（iOS Safari/微信）
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // 处理横竖屏切换时按钮位置重置
        window.addEventListener('orientationchange', function() {
            // 重置不愿意按钮回到原位
            btnNo.style.position = '';
            btnNo.style.left = '';
            btnNo.style.top = '';
            btnNo.style.transform = '';
            btnNo.style.transition = '';
            btnNo.textContent = '不愿意';
        });

        // 处理窗口尺寸变化（键盘弹起等）
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                // 如果按钮已经跑走，重新计算避免超出可视区域
                if (btnNo.style.position === 'fixed') {
                    const rect = btnNo.getBoundingClientRect();
                    if (rect.left > window.innerWidth - 100 || rect.top > window.innerHeight - 60) {
                        runAway(btnNo);
                    }
                }
            }, 200);
        });
    </script>
</body>
</html>
