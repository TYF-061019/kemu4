<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140d1c">
<meta name="format-detection" content="telephone=no">
<title>为美琳拼一张照片</title>
<style>
  :root{
    --bg:#140d1c;
    --ink:#f7eaf1;
    --muted:rgba(247,234,241,.55);
    --rose:#ff7d9e;
    --rose-deep:#e8618a;
    --gold:#f0c58f;
    --line:rgba(255,255,255,.10);
    --cell-radius:5px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    background:
      radial-gradient(120% 70% at 18% 0%, #3b1c3c 0%, rgba(20,13,28,0) 62%),
      radial-gradient(110% 75% at 88% 100%, #3a1930 0%, rgba(20,13,28,0) 66%),
      radial-gradient(80% 50% at 50% 45%, rgba(255,125,158,.10) 0%, rgba(20,13,28,0) 70%),
      #140d1c;
  }
  #app{
    position:fixed;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
  }

  /* 顶部 */
  header{
    width:100%;max-width:460px;height:42px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 2px;
  }
  .brand{
    display:flex;align-items:baseline;gap:6px;
    font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;
  }
  .brand b{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:16px;letter-spacing:.12em;color:var(--gold);font-weight:600;
  }
  .tools{display:flex;gap:8px;}
  .icon{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    color:rgba(255,255,255,.72);
    font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.2s;
  }
  .icon:active{transform:scale(.94);background:rgba(255,255,255,.12);}
  .icon.off{color:rgba(255,255,255,.28);}

  /* 舞台 */
  #stage{
    flex:1 1 auto;min-height:0;width:100%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  #boardWrap{
    display:flex;flex-direction:column;align-items:center;
    opacity:0;transform:translateY(8px);
    transition:opacity .5s ease,transform .5s ease;
  }
  #boardWrap.in{opacity:1;transform:none;}

  #board{
    position:relative;
    border-radius:16px;
    background:#1c1327;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.09),
      0 24px 60px rgba(0,0,0,.55),
      0 0 70px rgba(255,125,158,.13);
    overflow:hidden;
    touch-action:none;
  }
  #ghost{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background-position:center;background-size:cover;
    opacity:.10;filter:blur(5px) saturate(.85);
    transition:opacity .8s ease;
  }
  #grid{
    position:absolute;top:0;left:0;
    display:grid;
  }
  .cell{
    position:relative;
    background:rgba(255,255,255,.035);
    border-radius:var(--cell-radius);
    overflow:hidden;
    transition:background .3s;
  }
  .cell .frag{
    position:absolute;top:0;left:0;width:100%;height:100%;
    opacity:0;transform:scale(1.18);
    transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.25,1);
    background-repeat:no-repeat;
  }
  .cell.on .frag{opacity:1;transform:scale(1);}
  .cell.on{background:transparent;}
  .cell.pop .frag{animation:pop .32s ease;}
  @keyframes pop{0%{transform:scale(1.34);}60%{transform:scale(.97);}100%{transform:scale(1);}}
  .cell.magic .frag{animation:magic .7s ease both;}
  @keyframes magic{
    0%{opacity:0;transform:scale(.4) rotate(-12deg);filter:brightness(2.2);}
    55%{opacity:1;transform:scale(1.08) rotate(0);filter:brightness(1.6);}
    100%{opacity:1;transform:scale(1);filter:brightness(1);}
  }

  #final{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background-position:center;background-size:cover;
    opacity:0;pointer-events:none;transition:opacity 1s ease;
  }
  #final.on{opacity:1;}

  #shine{
    position:absolute;top:-20%;left:0;width:60%;height:140%;
    background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.34) 45%,rgba(255,255,255,0) 100%);
    transform:translateX(-160%) rotate(8deg);
    pointer-events:none;opacity:0;
  }
  #shine.run{animation:shine 1.25s cubic-bezier(.3,.7,.4,1) .15s 1 both;}
  @keyframes shine{
    0%{transform:translateX(-160%) rotate(8deg);opacity:0;}
    20%{opacity:1;}
    100%{transform:translateX(260%) rotate(8deg);opacity:0;}
  }

  #piece{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;}
  .pcell{
    position:absolute;
    border-radius:var(--cell-radius);
    background-color:#2c1d3a;
    background-repeat:no-repeat;
    opacity:.94;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.42),
      0 0 16px rgba(255,125,158,.4);
  }
  #hint{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;}
  .hcell{
    position:absolute;
    border-radius:var(--cell-radius);
    background:rgba(255,255,255,.05);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  }

  #fx{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;}
  #toast{
    position:absolute;left:50%;bottom:16px;
    transform:translate(-50%,10px);
    padding:10px 20px;border-radius:30px;
    background:rgba(20,12,28,.82);
    border:1px solid rgba(255,190,210,.35);
    color:#ffd9e4;font-size:12.5px;letter-spacing:.1em;white-space:nowrap;
    box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 24px rgba(255,125,158,.25);
    opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;
    z-index:6;
  }
  #toast.on{opacity:1;transform:translate(-50%,0);}
  .spark{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,rgba(255,180,205,.9) 45%,rgba(255,125,158,0) 70%);
    animation:spark 1.5s ease-out forwards;
  }
  @keyframes spark{
    0%{transform:translate3d(0,0,0) scale(.4);opacity:0;}
    25%{opacity:1;}
    100%{transform:translate3d(var(--dx),var(--dy),0) scale(1.3);opacity:0;}
  }

  /* 进度 */
  .progress{
    width:100%;margin-top:12px;display:flex;align-items:center;gap:10px;
    padding:0 2px;
  }
  .bar{
    flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#ff9ab5,#ffd0a8);
    box-shadow:0 0 10px rgba(255,154,181,.7);
    transition:width .5s cubic-bezier(.2,.9,.25,1);
  }
  .ptxt{font-size:11px;letter-spacing:.08em;color:var(--muted);min-width:56px;text-align:right;}

  /* 按键 */
  .controls{
    flex:0 0 auto;width:100%;max-width:460px;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    padding-top:14px;
  }
  .pad{display:flex;gap:12px;}
  .key{
    width:58px;height:58px;border-radius:20px;
    border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    color:rgba(255,255,255,.9);
    font-size:19px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .1s,background .2s,box-shadow .2s;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
    touch-action:manipulation;
  }
  .key:active{transform:translateY(2px) scale(.97);background:rgba(255,255,255,.16);}
  .key.drop{
    background:linear-gradient(160deg,#ff8fab,#f0608c);
    border-color:rgba(255,255,255,.34);
    box-shadow:0 8px 22px rgba(240,96,140,.45);
    color:#2b0c19;
  }
  .key.drop:active{box-shadow:0 3px 10px rgba(240,96,140,.4);}
  .subbtn{
    border:none;background:none;color:rgba(255,255,255,.42);
    font-size:12px;letter-spacing:.12em;padding:5px 14px;cursor:pointer;
  }
  .subbtn:active{color:rgba(255,255,255,.8);}

  /* 开场 */
  .screen{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));
    text-align:center;
    background:
      radial-gradient(90% 55% at 50% 0%, rgba(120,45,90,.55) 0%, rgba(20,13,28,0) 65%),
      radial-gradient(90% 60% at 50% 100%, rgba(90,35,70,.45) 0%, rgba(20,13,28,0) 70%),
      #140d1c;
    transition:opacity .6s ease,visibility .6s;
  }
  .screen.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .kicker{
    font-size:10px;letter-spacing:.38em;color:rgba(240,197,143,.75);
    text-transform:uppercase;margin-bottom:14px;
  }
  .screen h1{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:34px;line-height:1.35;font-weight:600;letter-spacing:.06em;
    color:#fff6fa;text-shadow:0 0 30px rgba(255,125,158,.35);
  }
  .screen h1 em{font-style:normal;color:var(--gold);}
  .sub{
    margin-top:14px;font-size:12.5px;letter-spacing:.16em;color:rgba(255,255,255,.48);
  }
  .polaroids{
    position:relative;width:230px;height:196px;margin:26px 0 22px;
  }
  .polaroid{
    position:absolute;top:0;width:132px;
    background:#fdf7f0;padding:7px 7px 26px;border-radius:3px;
    box-shadow:0 16px 34px rgba(0,0,0,.5);
    transition:transform .5s cubic-bezier(.2,.9,.25,1);
  }
  .polaroid img{width:100%;height:150px;object-fit:cover;display:block;background:#2a1a33;}
  .polaroid span{
    position:absolute;left:0;right:0;bottom:6px;text-align:center;
    font-family:"Songti SC",serif;font-size:11px;color:#b08a8a;letter-spacing:.14em;
  }
  .p1{left:6px;transform:rotate(-7deg);z-index:2;}
  .p2{right:6px;transform:rotate(6deg);}
  .p2 span{text-align:right;padding-right:9px;}
  .polaroids:hover .p1{transform:rotate(-10deg) translateY(-3px);}
  .polaroids:hover .p2{transform:rotate(9deg) translateY(-3px);}

  .primary{
    border:none;cursor:pointer;
    padding:16px 54px;border-radius:40px;
    font-size:15px;letter-spacing:.16em;color:#2b0c19;font-weight:600;
    background:linear-gradient(135deg,#ffb3c6 0%,#ff8fab 45%,#ffcf9e 100%);
    box-shadow:0 12px 30px rgba(240,96,140,.42),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .15s,box-shadow .2s;
  }
  .primary:active{transform:scale(.97);box-shadow:0 6px 16px rgba(240,96,140,.4);}
  .tip{margin-top:14px;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.3);}

  /* 情书 */
  #letter{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));
    background:rgba(10,6,14,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #letter.show{opacity:1;visibility:visible;}
  .card{
    position:relative;width:100%;max-width:392px;max-height:100%;
    display:flex;flex-direction:column;
    background:
      radial-gradient(120% 60% at 0% 0%,#fffdf9 0%,rgba(255,253,249,0) 60%),
      linear-gradient(180deg,#fffaf3 0%,#fbeede 100%);
    border-radius:20px;
    padding:18px 18px 16px;
    color:#5a4450;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.8);
    transform:translateY(26px) scale(.97);opacity:0;
    transition:transform .8s cubic-bezier(.2,.85,.25,1),opacity .7s ease;
  }
  #letter.show .card{transform:none;opacity:1;}
  .card-scroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 6px 4px 2px;
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 100%);
    mask-image:linear-gradient(to bottom,#000 0,#000 100%);
  }
  .card-scroll.has-more{
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),rgba(0,0,0,.15) 100%);
    mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),rgba(0,0,0,.15) 100%);
  }
  .card-scroll::-webkit-scrollbar{width:0;}
  .snap{
    position:relative;width:138px;margin:2px auto 12px;
    background:#fff;padding:7px 7px 22px;border-radius:2px;
    box-shadow:0 10px 26px rgba(120,70,90,.22);
    transform:rotate(-2.2deg);
  }
  .snap img{display:block;width:100%;height:150px;object-fit:cover;background:#f2e6dc;}
  .snap-cap{
    position:absolute;left:0;right:0;bottom:5px;text-align:center;
    font-family:"Songti SC","STSong",serif;font-size:10px;letter-spacing:.3em;color:#c49a9a;
  }
  .letter-kicker{
    text-align:center;font-size:9px;letter-spacing:.42em;color:#c79a94;margin-bottom:8px;
  }
  .card h2{
    text-align:center;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:20px;letter-spacing:.08em;color:#c0506f;font-weight:600;
    margin-bottom:12px;
  }
  .letter-body p{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:14px;line-height:1.9;letter-spacing:.015em;
    color:#5f4a55;margin-bottom:8px;text-align:left;
    word-break:break-word;
  }
  .letter-body p.first{color:#8b5c6c;}
  .letter-body .sign{
    margin-top:16px;text-align:right;color:#b0607a;line-height:1.9;font-size:13.5px;
  }
  .letter-body .sign span{font-size:11px;letter-spacing:.28em;color:#c49a9a;}
  .card .primary{
    display:block;margin:20px auto 0;padding:13px 40px;font-size:13px;
    font-family:inherit;
  }
  .hearts-float{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;border-radius:20px;}
  .hearts-float i{
    position:absolute;bottom:-30px;font-style:normal;font-size:14px;
    color:rgba(220,110,145,.55);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.8);opacity:0;}
    15%{opacity:.9;}
    100%{transform:translateY(-120vh) scale(1.1);opacity:0;}
  }

  @media (max-height:620px){
    .screen h1{font-size:28px;}
    .polaroids{width:200px;height:168px;margin:18px 0 16px;}
    .polaroid{width:112px;}
    .polaroid img{height:126px;}
    .key{width:52px;height:52px;border-radius:18px;}
    .controls{padding-top:10px;gap:6px;}
  }

  .letter-counter{
    text-align:center;font-size:11px;letter-spacing:.18em;color:#b08080;
    margin:-4px 0 14px;font-family:"Songti SC",serif;
  }
  .letter-nav{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin:14px 0 4px;
  }
  .nav-btn{
    width:38px;height:38px;border-radius:50%;
    background:#fff;border:1px solid rgba(192,80,111,.25);
    color:#c0506f;font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;font-family:inherit;
  }
  .nav-btn:active{transform:scale(.9);background:#fbeede;}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;}
  .nav-dot{color:#e8618a;font-size:10px;}
  .letter-body p.sign{margin-top:16px;text-align:right;color:#b0607a;line-height:1.9;font-size:13.5px;}
  .letter-body p.sign span{font-size:11px;letter-spacing:.28em;color:#c49a9a;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">for <b>美琳</b> · 11.10</div>
    <div class="tools">
      <button class="icon" id="soundBtn" aria-label="声音">♪</button>
      <button class="icon" id="resetBtn" aria-label="重来">↺</button>
    </div>
  </header>

  <div id="stage">
    <div id="boardWrap">
      <div id="board">
        <div id="ghost"></div>
        <div id="grid"></div>
        <div id="hint"></div>
        <div id="piece"></div>
        <div id="final"></div>
        <div id="shine"></div>
        <div id="fx"></div>
        <div id="toast"></div>
      </div>
      <div class="progress">
        <div class="bar"><i id="bar"></i></div>
        <div class="ptxt" id="ptxt">0%</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="pad">
      <button class="key" data-act="left" aria-label="左移">◀</button>
      <button class="key" data-act="rotate" aria-label="旋转">↻</button>
      <button class="key" data-act="right" aria-label="右移">▶</button>
      <button class="key drop" data-act="drop" aria-label="落下">▼</button>
    </div>
    <button class="subbtn" data-act="skip">换 一 块</button>
  </div>
</div>

<!-- 开场 -->
<div class="screen" id="startScreen">
  <div class="kicker">a little game for you</div>
  <h1>为<em>美琳</em><br>拼一张照片</h1>
  <p class="sub">俄罗斯方块 × 拼图 · 拼完有惊喜</p>
  <div class="polaroids">
    <div class="polaroid p1"><img id="previewA" alt=""><span>mei lin</span></div>
    <div class="polaroid p2"><img id="previewB" alt=""><span>11 · 10</span></div>
  </div>
  <button class="primary" id="startBtn">开 始 拼 图</button>
  <p class="tip">每一局，随机选一张我们的照片</p>
</div>

<!-- 情书 -->
<div id="letter">
  <div class="card">
    <div class="hearts-float" id="heartsFloat"></div>
    <div class="card-scroll">
      <div class="snap">
        <img id="letterPhoto" alt="">
        <div class="snap-cap" id="snapCap">11 · 10</div>
      </div>
      <div class="letter-kicker" id="letterKicker">HAPPY BIRTHDAY</div>
      <h2>吴美琳，生日快乐</h2>
      <div class="letter-counter" id="letterCounter">第 1 / 159 封</div>
      <div class="letter-body" id="letterBody"></div>
    </div>
    <div class="letter-nav">
      <button class="nav-btn" id="prevLetter" aria-label="上一封">‹</button>
      <span class="nav-dot" id="navDot">♥</span>
      <button class="nav-btn" id="nextLetter" aria-label="下一封">›</button>
    </div>
    <button class="primary" id="againBtn">再 拼 一 次 ♥</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============ 1. 照片配置（替换这里即可） ============ */

    {i:18,title:"第 18 封 · 给美琳",paras:["美琳：","我想成为你手机里永远满格的电量，成为你下雨天的伞，成为你寒冷时的暖宝宝。","你是我所有努力的动力，我想赚很多钱，给你买你想要的一切，让你永远不用为钱发愁。","我想和你一起去看樱花，在樱花树下拍照，留下我们最美的回忆。","你的专属守护者。"]},
    {i:19,title:"第 19 封 · 给美琳",paras:["我的美琳：","我喜欢你的小手，软软的暖暖的，牵在手里就不想放开，想一直牵到我们都老了。","今天你给我做了一顿饭，虽然有点咸，但我吃得干干净净，因为那是你做的。","今天你给我做了爱心早餐，虽然煎蛋有点糊，但我吃得一干二净，因为那是你的心意。","想和你共度一生的人。"]},

    {i:22,title:"第 22 封 · 给美琳",paras:["美琳：","今天看到一句话想送给你：愿你所有的快乐都无需假装，愿你此生尽兴，赤诚善良。","今天我们一起走过的路、看过的风景、说过的话，我都好好记在心里了。","谢谢你愿意让我爱你，能够爱你也被你爱，是我这辈子最大的幸福。","陪你到最后的我。"]},
    {i:23,title:"第 23 封 · 给美琳",paras:["我的美琳：","今天我们一起走过的路、看过的风景、说过的话，我都好好记在心里了。","今天下雨了你没带伞，我冒雨跑去给你送伞，看到你跑过来抱住我的那一刻觉得什么都值了。","今天我们一起去爬了山，爬到山顶你累得不行靠在我肩膀上，我觉得这座山爬得太值了。","想你到失眠的我。"]},

    {i:179,title:"第 179 封 · 给美琳",paras:["我的美琳：","今天你说你梦见我了，我问你梦见什么，你说梦见我们结婚了，我心里乐开了花。","今天我们一起去吃了烧烤，你被辣得直吐舌头，我递水给你的同时觉得你太可爱了。","你是我所有的幸运，遇见你用光了我所有的运气，但我觉得特别值得。","想你到失眠的我。"]},
    {i:180,title:"第 180 封 · 给美琳",paras:["致我最爱的美琳：","你是我拒绝所有人的理由，也是我接受所有人善意的原因，因为你让我变得更好。","今天我们一起去了动物园，你喂长颈鹿的样子特别温柔，我觉得你对小动物都这么好对我一定更好。","今天你说你想吃火锅，我立刻订了位子带你去，看到你吃得开心我也跟着开心。","把你刻在心上的我。"]}
  ];

  /* ============ 2. 常量 ============ */
  var COLS = 8;
  var ROWS = 14;
  var TOTAL = COLS * ROWS;

  var SHAPES = [
    [[1, 1, 1, 1]],           // I
    [[1, 1], [1, 1]],         // O
    [[0, 1, 0], [1, 1, 1]],   // T
    [[1, 0, 0], [1, 1, 1]],   // J
    [[0, 0, 1], [1, 1, 1]],   // L
    [[0, 1, 1], [1, 1, 0]],   // S
    [[1, 1, 0], [0, 1, 1]]    // Z
  ];

  /* ============ 3. DOM ============ */
  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board');
  var gridEl = $('grid');
  var ghostEl = $('ghost');
  var pieceEl = $('piece');
  var hintEl = $('hint');
  var finalEl = $('final');
  var shineEl = $('shine');
  var fxEl = $('fx');
  var toastEl = $('toast');
  var boardWrap = $('boardWrap');
  var stageEl = $('stage');
  var barEl = $('bar');
  var ptxtEl = $('ptxt');
  var startScreen = $('startScreen');
  var letterEl = $('letter');
  var letterPhoto = $('letterPhoto');
  var heartsFloat = $('heartsFloat');

  /* ============ 4. 状态 ============ */
  var cells = [];
  var board = [];
  var filled = 0;
  var cur = null;
  var state = 'idle';   // idle | playing | filling | reveal | letter
  var photoIdx = 0;
  var src = PHOTOS[0];
  var imgReady = false;
  var iw = 0, ih = 0;
  var cellW = 34, cellH = 34, gap = 2;
  var boardW = 0, boardH = 0;
  var bgW = 0, bgH = 0, ox = 0, oy = 0;
  var lastT = 0, acc = 0, raf = 0;
  var DROP_MS = 780;
  var lastPhoto = -1;
  var audioCtx = null;
  var muted = false;
  var musicTimer = 0;
  var musicStep = 0;

  /* ============ 5. 建格子 ============ */
  function buildGrid() {
    gridEl.innerHTML = '';
    cells = [];
    for (var i = 0; i < TOTAL; i++) {
      var d = document.createElement('div');
      d.className = 'cell';
      var f = document.createElement('div');
      f.className = 'frag';
      d.appendChild(f);
      gridEl.appendChild(d);
      cells.push(d);
    }
  }

  /* ============ 6. 尺寸与照片贴图 ============ */
  function layout() {
    if (!boardEl || boardWrap.offsetParent === null) return;
    var rect = stageEl.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;

    gap = 2;
    var availW = Math.min(rect.width, 430) - 2;
    var availH = rect.height - 48;
    var cw = (availW - gap * (COLS - 1)) / COLS;
    var ch = (availH - gap * (ROWS - 1)) / ROWS;
    var c = Math.floor(Math.min(cw, ch));
    if (c < 14) c = 14;

    cellW = c;
    cellH = c;

    boardW = cellW * COLS + gap * (COLS - 1);
    boardH = cellH * ROWS + gap * (ROWS - 1);

    boardEl.style.width = boardW + 'px';
    boardEl.style.height = boardH + 'px';
    gridEl.style.width = boardW + 'px';
    gridEl.style.height = boardH + 'px';
    gridEl.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellW + 'px)';
    gridEl.style.gridTemplateRows = 'repeat(' + ROWS + ', ' + cellH + 'px)';
    gridEl.style.gap = gap + 'px';

    paint();
    renderPiece();
    renderHint();
  }

  function paint() {
    if (!imgReady) return;
    var scale = Math.max(boardW / iw, boardH / ih);
    bgW = iw * scale;
    bgH = ih * scale;
    ox = (boardW - bgW) / 2;
    oy = (boardH - bgH) / 2;

    var stepX = cellW + gap;
    var stepY = cellH + gap;
    var url = 'url("' + src + '")';

    for (var i = 0; i < TOTAL; i++) {
      var c = i % COLS;
      var r = (i / COLS) | 0;
      var frag = cells[i].firstChild;
      frag.style.backgroundImage = url;
      frag.style.backgroundSize = bgW + 'px ' + bgH + 'px';
      frag.style.backgroundPosition = (ox - c * stepX) + 'px ' + (oy - r * stepY) + 'px';
    }

    ghostEl.style.backgroundImage = url;
    finalEl.style.backgroundImage = url;
    if (letterPhoto) letterPhoto.src = src;
  }

  function loadPhoto(idx, done) {
    src = PHOTOS[idx];
    imgReady = false;
    var img = new Image();
    img.onload = function () {
      iw = img.naturalWidth || img.width;
      ih = img.naturalHeight || img.height;
      imgReady = true;
      if (done) done();
    };
    img.onerror = function () {
      imgReady = false;
      if (done) done();
    };
    img.src = src;
  }

  /* ============ 7. 方块 ============ */
  function clone(m) {
    return m.map(function (row) { return row.slice(); });
  }

  function rotateMatrix(m) {
    var h = m.length, w = m[0].length, out = [];
    for (var c = 0; c < w; c++) {
      var row = [];
      for (var r = h - 1; r >= 0; r--) row.push(m[r][c]);
      out.push(row);
    }
    return out;
  }

  function hit(m, px, py) {
    for (var r = 0; r < m.length; r++) {
      for (var c = 0; c < m[r].length; c++) {
        if (!m[r][c]) continue;
        var x = px + c, y = py + r;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && board[y * COLS + x]) return true;
      }
    }
    return false;
  }

  function randomShape() {
    // 偶尔来一块小拼图，方便补齐缝隙
    if (Math.random() < 0.16) {
      var small = [[[1]], [[1, 1]], [[1], [1]]];
      return small[Math.floor(Math.random() * small.length)];
    }
    return SHAPES[Math.floor(Math.random() * SHAPES.length)];
  }

  function spawn() {
    if (state !== 'playing') return;
    var m = null, sx = 0, found = false;

    // 顶部空间紧张时，换一个放得下的方块，尽量不让游戏提前结束
    for (var attempt = 0; attempt < 28 && !found; attempt++) {
      var cand = clone(randomShape());
      var startX = Math.floor((COLS - cand[0].length) / 2);
      if (!hit(cand, startX, 0)) {
        m = cand; sx = startX; found = true; break;
      }
      for (var x = 0; x <= COLS - cand[0].length; x++) {
        if (!hit(cand, x, 0)) { m = cand; sx = x; found = true; break; }
      }
    }

    if (!found) {
      cur = null;
      finishAll();
      return;
    }
    cur = { m: m, x: sx, y: 0 };
    renderPiece();
    renderHint();
  }

  function renderPiece() {
    if (!cur) { pieceEl.innerHTML = ''; return; }
    var stepX = cellW + gap;
    var stepY = cellH + gap;
    var m = cur.m;
    var html = '';

    pieceEl.style.transform = 'translate3d(' + (cur.x * stepX) + 'px,' + (cur.y * stepY) + 'px,0)';

    for (var r = 0; r < m.length; r++) {
      for (var c = 0; c < m[r].length; c++) {
        if (!m[r][c]) continue;
        var bx = cur.x + c;
        var by = cur.y + r;
        var style = 'left:' + (c * stepX) + 'px;top:' + (r * stepY) + 'px;' +
                    'width:' + cellW + 'px;height:' + cellH + 'px;';
        if (imgReady && by >= 0) {
          style += 'background-image:url("' + src + '");' +
                   'background-size:' + bgW + 'px ' + bgH + 'px;' +
                   'background-position:' + (ox - bx * stepX) + 'px ' + (oy - by * stepY) + 'px;';
        }
        html += '<div class="pcell" style="' + style + '"></div>';
      }
    }
    pieceEl.innerHTML = html;
  }

  function renderHint() {
    if (!cur || state !== 'playing') { hintEl.innerHTML = ''; return; }
    var dy = 0;
    while (!hit(cur.m, cur.x, cur.y + dy + 1)) dy++;
    if (dy === 0) { hintEl.innerHTML = ''; return; }

    var stepX = cellW + gap;
    var stepY = cellH + gap;
    var html = '';
    for (var r = 0; r < cur.m.length; r++) {
      for (var c = 0; c < cur.m[r].length; c++) {
        if (!cur.m[r][c]) continue;
        var bx = cur.x + c;
        var by = cur.y + r + dy;
        if (by < 0) continue;
        html += '<div class="hcell" style="left:' + (bx * stepX) + 'px;top:' + (by * stepY) + 'px;' +
                'width:' + cellW + 'px;height:' + cellH + 'px;"></div>';
      }
    }
    hintEl.innerHTML = html;
  }

  function move(dx, dy) {
    if (!cur || state !== 'playing') return false;
    if (!hit(cur.m, cur.x + dx, cur.y + dy)) {
      cur.x += dx;
      cur.y += dy;
      renderPiece();
      renderHint();
      return true;
    }
    if (dy > 0) lockPiece();
    return false;
  }

  function rotate() {
    if (!cur || state !== 'playing') return;
    var m = rotateMatrix(cur.m);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!hit(m, cur.x + kicks[i], cur.y)) {
        cur.m = m;
        cur.x += kicks[i];
        renderPiece();
        renderHint();
        sfx(320, 0.05, 0.03);
        return;
      }
    }
  }

  function hardDrop() {
    if (!cur || state !== 'playing') return;
    while (!hit(cur.m, cur.x, cur.y + 1)) cur.y++;
    renderPiece();
    lockPiece();
  }

  function lockPiece() {
    if (!cur) return;
    var m = cur.m;
    var x0 = cur.x, y0 = cur.y;
    var added = 0;

    for (var r = 0; r < m.length; r++) {
      for (var c = 0; c < m[r].length; c++) {
        if (!m[r][c]) continue;
        var x = x0 + c, y = y0 + r;
        if (y < 0 || x < 0 || x >= COLS || y >= ROWS) continue;
        var idx = y * COLS + x;
        if (board[idx]) continue;
        board[idx] = 1;
        filled++;
        added++;
        var el = cells[idx];
        el.classList.add('on', 'pop');
        (function (node) {
          setTimeout(function () { node.classList.remove('pop'); }, 340);
        })(el);
        sparkAt(x, y);
      }
    }

    cur = null;
    pieceEl.innerHTML = '';
    hintEl.innerHTML = '';
    updateProgress();
    if (added) sfx(180, 0.09, 0.05);

    setTimeout(settle, 80);
  }

  function settle() {
    if (state !== 'playing') return;
    magicFill();
    if (filled >= TOTAL) {
      state = 'reveal';
      setTimeout(reveal, 520);
      return;
    }
    spawn();
  }

  function magicFill() {
    var changed = true;
    while (changed) {
      changed = false;
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var idx = r * COLS + c;
          if (board[idx]) continue;
          var l = c === 0 || board[idx - 1];
          var rr = c === COLS - 1 || board[idx + 1];
          var d = r === ROWS - 1 || board[idx + COLS];
          if (l && rr && d) {
            board[idx] = 1;
            filled++;
            cells[idx].classList.add('on', 'magic');
            changed = true;
          }
        }
      }
    }
    if (filled < TOTAL && TOTAL - filled <= 5) fillAll();
  }

  function fillAll() {
    if (state !== 'playing') return;
    state = 'filling';
    cur = null;
    pieceEl.innerHTML = '';
    hintEl.innerHTML = '';
    var rest = [];
    for (var i = 0; i < TOTAL; i++) if (!board[i]) rest.push(i);
    for (var k = 0; k < rest.length; k++) {
      (function (idx, delay) {
        setTimeout(function () {
          if (board[idx]) return;
          board[idx] = 1;
          filled++;
          cells[idx].style.transitionDelay = '0ms';
          cells[idx].classList.add('on', 'magic');
          sparkAt(idx % COLS, (idx / COLS) | 0);
          updateProgress();
          if (filled >= TOTAL) {
            state = 'reveal';
            setTimeout(reveal, 420);
          }
        }, delay);
      })(rest[k], k * 55);
    }
  }

  function finishAll() {
    if (state !== 'playing') return;
    toast('剩下的，交给心动 ♥');
    fillAll();
  }

  var toastTimer = 0;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2400);
  }

  /* ============ 8. 进度与特效 ============ */
  function updateProgress() {
    var pct = Math.round(filled / TOTAL * 100);
    barEl.style.width = pct + '%';
    ptxtEl.textContent = pct + '%';
  }

  function sparkAt(c, r) {
    var stepX = cellW + gap;
    var stepY = cellH + gap;
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.left = (c * stepX + cellW / 2 - 3) + 'px';
    s.style.top = (r * stepY + cellH / 2 - 3) + 'px';
    s.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
    s.style.setProperty('--dy', (-Math.random() * 40 - 10) + 'px');
    fxEl.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1600);
  }

  function burst() {
    for (var i = 0; i < 26; i++) {
      (function (k) {
        setTimeout(function () {
          var s = document.createElement('div');
          s.className = 'spark';
          s.style.left = (10 + Math.random() * 80) + '%';
          s.style.top = (20 + Math.random() * 70) + '%';
          s.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
          s.style.setProperty('--dy', (-Math.random() * 70 - 20) + 'px');
          fxEl.appendChild(s);
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1600);
        }, k * 45);
      })(i);
    }
  }

  /* ============ 9. 游戏循环 ============ */
  function loop(t) {
    if (state !== 'playing') { raf = 0; return; }
    raf = requestAnimationFrame(loop);
    if (!lastT) lastT = t;
    var dt = t - lastT;
    lastT = t;
    acc += dt;
    if (acc >= DROP_MS) {
      acc = 0;
      move(0, 1);
    }
  }

  function startLoop() {
    if (raf) cancelAnimationFrame(raf);
    lastT = 0;
    acc = 0;
    raf = requestAnimationFrame(loop);
  }

  /* ============ 10. 一局开始 / 完成 / 情书 ============ */
  function pickPhoto() {
    var idx;
    if (lastPhoto < 0) {
      idx = Math.random() < 0.5 ? 0 : 1;
    } else {
      idx = lastPhoto === 0 ? 1 : 0;
    }
    lastPhoto = idx;
    photoIdx = idx;
    return idx;
  }

  function resetBoard() {
    board = new Array(TOTAL).fill(0);
    filled = 0;
    cur = null;
    pieceEl.innerHTML = '';
    hintEl.innerHTML = '';
    fxEl.innerHTML = '';
    finalEl.classList.remove('on');
    shineEl.classList.remove('run');
    for (var i = 0; i < TOTAL; i++) {
      cells[i].classList.remove('on', 'pop', 'magic');
      cells[i].style.transitionDelay = '0ms';
    }
    updateProgress();
  }

  function startRound() {
    letterEl.classList.remove('show');
    state = 'starting';
    resetBoard();
    var idx = pickPhoto();
    loadPhoto(idx, function () {
      layout();
      paint();
      state = 'playing';
      boardWrap.classList.add('in');
      startScreen.classList.add('hide');
      spawn();
      startLoop();
    });
  }

  function reveal() {
    state = 'reveal';
    pieceEl.innerHTML = '';
    hintEl.innerHTML = '';
    boardWrap.classList.add('in');
    finalEl.classList.add('on');
    ghostEl.style.opacity = '0';
    shineEl.classList.remove('run');
    void shineEl.offsetWidth;
    shineEl.classList.add('run');
    burst();
    chime();
    updateProgress();
    setTimeout(function () {
      showLetter();
    }, 1500);
  }

  var letterIdx = 0;
  function showLetter() {
    state = 'letter';
    // 随机选一封情书
    letterIdx = Math.floor(Math.random() * LETTERS.length);
    renderLetter();
    letterEl.classList.add('show');
    letterPhoto.src = src;
    letterEl.scrollTop = 0;
    spawnCardHearts();
    setTimeout(updateLetterFade, 80);
  }

  function renderLetter() {
    var L = LETTERS[letterIdx];
    var body = $('letterBody');
    var counter = $('letterCounter');
    if (!body) return;
    var html = '';
    for (var i = 0; i < L.paras.length; i++) {
      if (i === 0) {
        html += '<p class="first">' + L.paras[i] + '</p>';
      } else if (i === L.paras.length - 1) {
        html += '<p class="sign">—— ' + L.paras[i] + '<br><span>11 · 10</span></p>';
      } else {
        html += '<p>' + L.paras[i] + '</p>';
      }
    }
    body.innerHTML = html;
    if (counter) counter.textContent = '第 ' + L.i + ' / ' + LETTERS.length + ' 封';
    // 更新按钮状态
    var prev = $('prevLetter');
    var next = $('nextLetter');
    if (prev) prev.disabled = (letterIdx <= 0);
    if (next) next.disabled = (letterIdx >= LETTERS.length - 1);
  }

  function gotoLetter(dir) {
    var ni = letterIdx + dir;
    if (ni < 0 || ni >= LETTERS.length) return;
    letterIdx = ni;
    renderLetter();
    var cs = document.querySelector('.card-scroll');
    if (cs) cs.scrollTop = 0;
    setTimeout(updateLetterFade, 60);
  }

  function updateLetterFade() {
    var el = document.querySelector('.card-scroll');
    if (!el) return;
    if (el.scrollHeight - el.scrollTop - el.clientHeight > 10) {
      el.classList.add('has-more');
    } else {
      el.classList.remove('has-more');
    }
  }

  function spawnCardHearts() {
    heartsFloat.innerHTML = '';
    for (var i = 0; i < 10; i++) {
      var h = document.createElement('i');
      h.textContent = '♥';
      h.style.left = (6 + Math.random() * 88) + '%';
      h.style.fontSize = (9 + Math.random() * 9) + 'px';
      h.style.animationDuration = (7 + Math.random() * 6) + 's';
      h.style.animationDelay = (-Math.random() * 8) + 's';
      h.style.opacity = 0.25 + Math.random() * 0.4;
      heartsFloat.appendChild(h);
    }
  }

  /* ============ 11. 声音 ============ */
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { audioCtx = new AC(); } catch (e) { return false; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return true;
  }

  function tone(freq, dur, vol, type, delay) {
    if (!audioCtx || muted) return;
    var t = audioCtx.currentTime + (delay || 0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  function sfx(f, d, v) {
    tone(f, d, v, 'sine');
    tone(f * 2, d * 0.6, v * 0.35, 'triangle', 0.01);
  }

  var MELODY = [523.25, 0, 659.25, 783.99, 0, 698.46, 659.25, 587.33];
  var BASS = [130.81, 110, 146.83, 174.61];

  function startMusic() {
    if (!audioCtx || musicTimer) return;
    musicStep = 0;
    musicTimer = setInterval(function () {
      if (muted || !audioCtx) return;
      var n = MELODY[musicStep % MELODY.length];
      if (n) tone(n, 1.5, 0.035, 'sine');
      if (musicStep % 4 === 0) {
        tone(BASS[(musicStep / 4 | 0) % BASS.length], 1.6, 0.022, 'sine');
      }
      musicStep++;
    }, 520);
  }

  function chime() {
    var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    for (var i = 0; i < notes.length; i++) {
      tone(notes[i], 1.3, 0.055, 'sine', i * 0.1);
      tone(notes[i] * 2, 0.9, 0.02, 'triangle', i * 0.1);
    }
  }

  /* ============ 12. 交互 ============ */
  var holdTimer = 0;
  var holdRepeat = 0;

  function act(a) {
    if (state !== 'playing') return;
    if (a === 'left') move(-1, 0);
    else if (a === 'right') move(1, 0);
    else if (a === 'rotate') rotate();
    else if (a === 'drop') hardDrop();
    else if (a === 'skip') {
      sfx(240, 0.1, 0.03);
      cur = null;
      pieceEl.innerHTML = '';
      hintEl.innerHTML = '';
      spawn();
    }
  }

  function bindPress(el, fn) {
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        fn();
      });
    } else {
      el.addEventListener('touchstart', function (e) {
        e.preventDefault();
        fn();
      }, { passive: false });
      el.addEventListener('mousedown', function (e) {
        e.preventDefault();
        fn();
      });
    }
  }

  function bindHold(el, a) {
    var start = function (e) {
      if (e.cancelable) e.preventDefault();
      act(a);
      clearTimeout(holdTimer);
      clearInterval(holdRepeat);
      holdTimer = setTimeout(function () {
        holdRepeat = setInterval(function () { act(a); }, 105);
      }, 210);
    };
    var stop = function () {
      clearTimeout(holdTimer);
      clearInterval(holdRepeat);
    };

    if (window.PointerEvent) {
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
      el.addEventListener('pointerleave', stop);
    } else {
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', stop);
      el.addEventListener('touchcancel', stop);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', stop);
      el.addEventListener('mouseleave', stop);
    }
  }

  document.querySelectorAll('[data-act]').forEach(function (el) {
    var a = el.getAttribute('data-act');
    if (a === 'left' || a === 'right') {
      bindHold(el, a);
    } else {
      bindPress(el, function () { act(a); });
    }
  });

  document.getElementById('startBtn').addEventListener('click', function () {
    ensureAudio();
    startMusic();
    startRound();
  });

  document.getElementById('againBtn').addEventListener('click', function () {
    startRound();
  });
  $('prevLetter').addEventListener('click', function () { gotoLetter(-1); });
  $('nextLetter').addEventListener('click', function () { gotoLetter(1); });

  $('resetBtn').addEventListener('click', function () {
    if (state === 'idle') return;
    startRound();
  });

  $('soundBtn').addEventListener('click', function () {
    muted = !muted;
    this.classList.toggle('off', muted);
    this.textContent = muted ? '✕' : '♪';
    if (!muted) {
      ensureAudio();
      startMusic();
      tone(880, 0.2, 0.04, 'sine');
    }
  });

  // 手势
  var tsX = 0, tsY = 0, tsT = 0, moved = false;
  boardEl.addEventListener('touchstart', function (e) {
    if (state !== 'playing') return;
    var t = e.touches[0];
    tsX = t.clientX; tsY = t.clientY; tsT = Date.now(); moved = false;
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (state !== 'playing') return;
    var t = e.touches[0];
    var dx = t.clientX - tsX;
    var step = cellW + gap;
    if (Math.abs(dx) >= step * 0.9) {
      move(dx > 0 ? 1 : -1, 0);
      tsX = t.clientX;
      moved = true;
    }
  }, { passive: true });

  boardEl.addEventListener('touchend', function (e) {
    if (state !== 'playing') return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tsX;
    var dy = t.clientY - tsY;
    var dt = Date.now() - tsT;

    if (dy > 45 && Math.abs(dy) > Math.abs(dx)) {
      hardDrop();
      return;
    }
    if (!moved && Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 260) {
      rotate();
    }
  }, { passive: true });

  // 键盘（电脑上调试）
  document.addEventListener('keydown', function (e) {
    if (state !== 'playing') return;
    if (e.key === 'ArrowLeft') { move(-1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { move(1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { move(0, 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { rotate(); e.preventDefault(); }
    else if (e.key === ' ') { hardDrop(); e.preventDefault(); }
  });

  window.addEventListener('resize', function () {
    setTimeout(layout, 80);
    setTimeout(updateLetterFade, 120);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(layout, 260);
  });

  /* ============ 13. 启动 ============ */
  function boot() {
    buildGrid();
    board = new Array(TOTAL).fill(0);
    updateProgress();

    var scroller = document.querySelector('.card-scroll');
    if (scroller) scroller.addEventListener('scroll', updateLetterFade, { passive: true });

    // 开场两张照片
    $('previewA').src = PHOTOS[0];
    $('previewB').src = PHOTOS[1];

    // 预加载
    PHOTOS.forEach(function (p) { var im = new Image(); im.src = p; });

    loadPhoto(0, function () {
      layout();
      paint();
      boardWrap.classList.add('in');
    });
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    boot();
  } else {
    document.addEventListener('DOMContentLoaded', boot);
  }
})();
</script>
</body>
</html>
