<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>1Bit邮局</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { height:100%; background:#f0f0f0; color:#1a1a1a; font-family: -apple-system, "PingFang SC", sans-serif; overflow:hidden; touch-action:none; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #wrap { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background:#ffffff; box-shadow: 0 0 0 2px #1a1a1a, 0 0 24px rgba(0,0,0,.2); border-radius:6px; }
  .dpad { position:absolute; bottom:14px; left:18px; display:grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap:3px; }
  .dpad button { background:#1a1a1a; border:2px solid #1a1a1a; color:#fff; font-size:22px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  .dpad button:active { background:#e84c4c; }
  .dpad .up { grid-column:2; grid-row:1; } .dpad .left { grid-column:1; grid-row:2; } .dpad .right { grid-column:3; grid-row:2; } .dpad .down { grid-column:2; grid-row:3; }
  .deliver-btn { position:absolute; bottom:30px; right:24px; width:84px; height:84px; border-radius:50%; background:#e84c4c; color:#fff; border:3px solid #1a1a1a; font-size:16px; font-weight:bold; box-shadow: 0 5px 0 #a02020; display:none; }
  .deliver-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #a02020; }
  .letter-box { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#ffd93d; padding:10px 16px; border-radius:10px; font-size:13px; max-width:80%; text-align:center; line-height:1.6; border:2px solid #ffd93d; display:none; z-index:6; }
  .letter-box .lbl { font-size:10px; color:#8a8aa0; margin-bottom:2px; }
  .overlay { position:absolute; inset:0; background:rgba(240,240,240,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; z-index:10; }
  .overlay h2 { font-size:26px; margin-bottom:12px; color:#1a1a1a; letter-spacing:4px; }
  .overlay p { font-size:14px; color:#555; line-height:1.8; margin-bottom:20px; max-width:320px; }
  .btn { background:#1a1a1a; color:#ffd93d; border:none; padding:12px 32px; border-radius:10px; font-size:16px; font-weight:bold; box-shadow: 0 4px 0 #444; cursor:pointer; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #444; }
  .back { position:absolute; top:10px; left:10px; color:#888; font-size:12px; text-decoration:none; z-index:5; }
</style>
</head>
<body>
<a href="index.html" class="back">← 返回</a>
<div id="wrap">
  <canvas id="game" width="240" height="160"></canvas>
  <div class="letter-box" id="letterBox">
    <div class="lbl">第 <span id="letterIdx">1</span> 封信</div>
    <div id="letterText">线索</div>
  </div>
  <button class="deliver-btn" id="deliverBtn">送信</button>
  <div class="dpad" id="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>
  <div id="overlay" class="overlay">
    <h2>1Bit 邮局</h2>
    <p>黑白小镇的邮差。<br>根据信上的线索，把信送到正确的人家门口，<br>再点「送信」。<br>每送对一封，世界就多一种颜色。<br>送错 3 次就下班啦。</p>
    <button class="btn" id="startBtn">开始送信</button>
  </div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=240,H=160,HUD_H=16;
function fit(){const s=Math.min((window.innerWidth-20)/W,(window.innerHeight-200)/H,4);canvas.style.width=(W*s)+'px';canvas.style.height=(H*s)+'px';}
window.addEventListener('resize',fit);fit();
let colorLevel=0;
const C={ground:l=>l>=3?'#7ec850':'#ffffff',groundAlt:l=>l>=3?'#6bb840':'#f0f0f0',wall:l=>l>=5?'#f5e6c8':'#ffffff',wallShade:l=>l>=5?'#d8c8a0':'#f0f0f0',roof:l=>l>=1?'#e84c4c':'#1a1a1a',window:l=>l>=2?'#4aa3ff':'#1a1a1a',windowLit:l=>l>=2?'#ffe080':'#ffffff',door:l=>l>=4?'#ffb84d':'#1a1a1a',chimney:l=>l>=1?'#b04040':'#1a1a1a',flag:l=>l>=1?'#e84c4c':'#1a1a1a',antenna:l=>l>=2?'#888888':'#1a1a1a',playerHat:l=>l>=1?'#e84c4c':'#1a1a1a',outline:'#1a1a1a'};
const HOUSES=[{x:8,y:24,w:56,h:44,chimney:true,windows:2,antenna:false,flag:false,wide:false,clue:'烟囱 + 两扇窗'},{x:176,y:24,w:56,h:44,chimney:false,windows:1,antenna:true,flag:false,wide:false,clue:'一扇窗 + 天线'},{x:8,y:96,w:56,h:44,chimney:true,windows:1,antenna:false,flag:true,wide:false,clue:'烟囱 + 旗帜'},{x:176,y:96,w:64,h:44,chimney:false,windows:3,antenna:false,flag:false,wide:true,clue:'三扇窗的大房子'},{x:92,y:60,w:56,h:44,chimney:false,windows:2,antenna:false,flag:false,wide:false,clue:'两扇窗的小屋（无烟囱）'}];
HOUSES.forEach(h=>{h.doorX=h.x+h.w/2-5;h.doorY=h.y+h.h-10;h.doorW=10;h.doorH=10;});
let player={x:120,y:140,w:10,h:12},letters=[],curLetter=0,lives=3,delivered=0,running=false,shake=0,nearHouse=null,flash=0,flashTimer=0;
const keys={up:false,down:false,left:false,right:false};
function bindBtn(s,d){const b=document.querySelector(s);const on=e=>{e.preventDefault();keys[d]=true;};const off=e=>{e.preventDefault();keys[d]=false;};b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);}
bindBtn('.up','up');bindBtn('.down','down');bindBtn('.left','left');bindBtn('.right','right');
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp')keys.up=true;if(e.key==='ArrowDown')keys.down=true;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;});
window.addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=false;if(e.key==='ArrowDown')keys.down=false;if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){letters=shuffle([0,1,2,3,4]);curLetter=0;lives=3;delivered=0;colorLevel=0;player.x=120;player.y=140;running=true;document.getElementById('overlay').style.display='none';document.getElementById('letterBox').style.display='block';showLetter();}
document.getElementById('startBtn').addEventListener('click',startGame);
function showLetter(){const hi=letters[curLetter];document.getElementById('letterIdx').textContent=(curLetter+1);document.getElementById('letterText').textContent=HOUSES[hi].clue;}
function showOverlay(t,b,bt,a){const o=document.getElementById('overlay');o.innerHTML=`<h2>${t}</h2><p>${b}</p><button class="btn" id="ovBtn">${bt}</button>`;o.style.display='flex';document.getElementById('ovBtn').addEventListener('click',a);}
function collides(x,y){for(const h of HOUSES){if(x+player.w>h.x&&x<h.x+h.w&&y+player.h>h.y&&y<h.y+h.h)return true;}return false;}
function update(dt){
  if(!running)return;
  if(shake>0)shake-=dt;
  if(flashTimer>0){flashTimer-=dt;if(flashTimer<=0)flash=0;}
  const spd=70;let dx=0,dy=0;
  if(keys.up)dy-=1;if(keys.down)dy+=1;if(keys.left)dx-=1;if(keys.right)dx+=1;
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  const nx=player.x+dx*spd*dt,ny=player.y+dy*spd*dt;
  if(nx>=2&&nx+player.w<=W-2&&!collides(nx,player.y))player.x=nx;
  if(ny>=HUD_H+2&&ny+player.h<=H-2&&!collides(player.x,ny))player.y=ny;
  nearHouse=null;let minD=999;
  for(const h of HOUSES){const d=Math.hypot((h.doorX+h.doorW/2)-(player.x+player.w/2),(h.doorY+h.doorH/2)-(player.y+player.h/2));if(d<16&&d<minD){minD=d;nearHouse=h;}}
  document.getElementById('deliverBtn').style.display=nearHouse?'block':'none';
}
document.getElementById('deliverBtn').addEventListener('click',()=>{
  if(!nearHouse||!running)return;
  const th=HOUSES[letters[curLetter]];
  if(nearHouse===th){delivered++;colorLevel=delivered;flash=1;flashTimer=0.6;if(delivered>=5){running=false;setTimeout(()=>{showOverlay('小镇亮起来了',`5 封信全部送达！<br>黑白世界重新染上了颜色。<br>剩余生命: ${lives}`,'再送一次',startGame);document.getElementById('letterBox').style.display='none';document.getElementById('deliverBtn').style.display='none';},600);}else{curLetter++;setTimeout(showLetter,400);}}
  else{lives--;flash=-1;flashTimer=0.5;shake=0.3;if(lives<=0){running=false;setTimeout(()=>{showOverlay('下班了',`送错太多次，邮差被投诉了…<br>成功送达: ${delivered}/5`,'重新开始',startGame);document.getElementById('letterBox').style.display='none';document.getElementById('deliverBtn').style.display='none';},500);}}
});
function drawHouse(h){
  const l=colorLevel,ox=shake>0?(Math.random()*4-2):0,oy=shake>0?(Math.random()*4-2):0,x=h.x+ox,y=h.y+oy,rw=h.w;
  ctx.fillStyle=C.wall(l);ctx.fillRect(x,y+12,h.w,h.h-12);
  ctx.fillStyle=C.outline;ctx.fillRect(x,y+12,h.w,1);ctx.fillRect(x,y+h.h-1,h.w,1);ctx.fillRect(x,y+12,1,h.h-12);ctx.fillRect(x+h.w-1,y+12,1,h.h-12);
  ctx.fillStyle=C.wallShade(l);ctx.fillRect(x+1,y+h.h-5,h.w-2,4);
  ctx.fillStyle=C.roof(l);for(let i=0;i<12;i++){const w=rw-i*2;ctx.fillRect(x+i,y+12-i,w,1);}
  ctx.fillStyle=C.outline;for(let i=0;i<12;i++){const w=rw-i*2;ctx.fillRect(x+i,y+12-i,1,1);ctx.fillRect(x+i+w-1,y+12-i,1,1);}ctx.fillRect(x,y+12,rw,1);
  if(h.chimney){ctx.fillStyle=C.chimney(l);ctx.fillRect(x+rw-14,y,8,8);ctx.fillStyle=C.outline;ctx.fillRect(x+rw-14,y,8,1);ctx.fillRect(x+rw-14,y,1,8);ctx.fillRect(x+rw-7,y,1,8);}
  if(h.antenna){ctx.fillStyle=C.antenna(l);ctx.fillRect(x+8,y-6,1,8);ctx.fillRect(x+4,y-6,9,1);}
  if(h.flag){ctx.fillStyle=C.outline;ctx.fillRect(x+6,y-8,1,10);ctx.fillStyle=C.flag(l);ctx.fillRect(x+7,y-8,5,4);}
  const wy=y+20,nwin=h.windows,sp=h.w/(nwin+1);
  for(let i=0;i<nwin;i++){const wx=x+sp*(i+1)-4;ctx.fillStyle=C.window(l);ctx.fillRect(wx,wy,8,8);ctx.fillStyle=C.windowLit(l);ctx.fillRect(wx+1,wy+1,3,3);ctx.fillStyle=C.outline;ctx.fillRect(wx,wy,8,1);ctx.fillRect(wx,wy+7,8,1);ctx.fillRect(wx,wy,1,8);ctx.fillRect(wx+7,wy,1,8);ctx.fillRect(wx+4,wy,1,8);}
  const dx=h.doorX+ox,dy=h.doorY+oy;
  ctx.fillStyle=C.door(l);ctx.fillRect(dx,dy,h.doorW,h.doorH);
  ctx.fillStyle=C.outline;ctx.fillRect(dx,dy,h.doorW,1);ctx.fillRect(dx,dy,1,h.doorH);ctx.fillRect(dx+h.doorW-1,dy,1,h.doorH);
  ctx.fillStyle=l>=4?'#1a1a1a':'#fff';ctx.fillRect(dx+h.doorW-3,dy+5,1,1);
}
function draw(){
  const l=colorLevel;
  ctx.fillStyle=C.ground(l);ctx.fillRect(0,HUD_H,W,H-HUD_H);
  ctx.fillStyle=C.groundAlt(l);for(let y=HUD_H;y<H;y+=8){for(let x=(y%16?0:4);x<W;x+=16){ctx.fillRect(x,y,2,2);}}
  ctx.fillStyle=l>=3?'#c8b080':'#e0e0e0';ctx.fillRect(0,80,W,8);
  for(const h of HOUSES)drawHouse(h);
  const px=Math.round(player.x),py=Math.round(player.y);
  ctx.fillStyle=l>=3?'rgba(0,0,0,.15)':'rgba(0,0,0,.1)';ctx.fillRect(px+1,py+player.h-1,player.w-2,2);
  ctx.fillStyle=l>=1?'#2a60c8':'#1a1a1a';ctx.fillRect(px+1,py+5,player.w-2,6);
  ctx.fillStyle='#ffe0c0';ctx.fillRect(px+2,py+1,player.w-4,5);
  ctx.fillStyle=C.playerHat(l);ctx.fillRect(px+1,py,player.w-2,2);ctx.fillRect(px,py+1,player.w,1);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(px+3,py+3,1,1);ctx.fillRect(px+6,py+3,1,1);
  ctx.fillStyle=l>=4?'#a06020':'#1a1a1a';ctx.fillRect(px+player.w-2,py+6,2,4);
  if(flash!==0){ctx.fillStyle=flash>0?'rgba(80,220,80,.25)':'rgba(220,60,60,.3)';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,HUD_H);
  ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textBaseline='top';ctx.fillText('信 '+(curLetter+1)+'/5',4,4);
  ctx.fillStyle='#e84c4c';for(let i=0;i<3;i++){const hx=60+i*14;if(i<lives){ctx.fillRect(hx,5,3,3);ctx.fillRect(hx+6,5,3,3);ctx.fillRect(hx+1,4,7,1);ctx.fillRect(hx+2,8,5,1);ctx.fillRect(hx+3,9,3,1);ctx.fillRect(hx+4,10,1,1);}else{ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.strokeRect(hx,5,9,7);}}
  ctx.fillStyle='#555';ctx.fillRect(W-56,5,50,6);
  for(let i=0;i<colorLevel;i++){const cols=['#e84c4c','#4aa3ff','#7ec850','#ffb84d','#ff6bb0'];ctx.fillStyle=cols[i];ctx.fillRect(W-56+i*10,6,10,4);}
}
let last=0;function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
