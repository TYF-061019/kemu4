<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手机芯片榜">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>手机芯片排行榜</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--border:#e5e5e5;--text:#1a1a1a;--muted:#86868b;--brand:#0ea5e9;--brand-soft:#e0f2fe;--gold:#f59e0b;--silver:#94a3b8;--bronze:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding-bottom:80px}
header{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(14,165,233,.3)}
header h1{font-size:18px;font-weight:700}
header p{font-size:12px;opacity:.85;margin-top:2px}
.toolbar{display:flex;gap:8px;padding:12px 16px;position:sticky;top:64px;background:var(--bg);z-index:99}
.toolbar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff}
.list{padding:0 16px}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border);cursor:pointer}
.item .row1{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff}
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.rank-2{background:linear-gradient(135deg,#94a3b8,#64748b)}
.rank-3{background:linear-gradient(135deg,#f97316,#b45309)}
.rank-other{background:var(--brand)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;font-size:15px}
.item .mfr{font-size:12px;color:var(--muted);margin-top:2px}
.item .score{font-weight:700;font-size:16px;color:var(--brand);text-align:right;flex-shrink:0}
.item .score small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.item .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500}
.tag-mfr{background:var(--brand-soft);color:var(--brand)}
.tag-proc{background:#fef3c7;color:#92400e}
.tag-gpu{background:#dbeafe;color:#1e40af}
.detail{display:none;padding:12px;background:#fafafa;border-radius:10px;margin-top:10px;font-size:13px}
.detail.show{display:block}
.detail .d-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee}
.detail .d-row:last-child{border:none}
.detail .d-label{color:var(--muted)}
.detail .d-val{font-weight:500;text-align:right;max-width:65%}
</style>
</head>
<body>
<header>
  <h1>🔬 手机芯片排行榜</h1>
  <p id="subtitle">手机SoC处理器性能排名 · 2026年最新数据</p>
</header>
<div class="toolbar">
  <input id="search" placeholder="搜索芯片型号或厂商...">
  <button id="refreshBtn" title="刷新数据" style="padding:0 14px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:18px">🔄</button>
</div>
<div class="list" id="list"><div style="text-align:center;color:var(--muted);padding:40px">加载中...</div></div>

<script>
const list=document.getElementById('list');
const search=document.getElementById('search');
const subtitle=document.getElementById('subtitle');
const refreshBtn=document.getElementById('refreshBtn');
const CACHE_KEY='phone_soc_data_v1';
let SOCS=[];

function rankClass(i){return i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other'}
function fmt(n){return n>=10000?(n/10000).toFixed(1)+'万':n.toLocaleString()}

function render(){
  if(SOCS.length===0){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px">暂无数据，请检查网络后刷新</div>';return}
  const kw=search.value.trim().toLowerCase();
  let filtered=SOCS.filter(s=>!kw||s.name.toLowerCase().includes(kw)||(s.brand||'').toLowerCase().includes(kw)).sort((a,b)=>(b.antutuAI||0)-(a.antutuAI||0));
  if(filtered.length===0){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px">未找到匹配的芯片</div>';return}
  list.innerHTML=filtered.map((s,i)=>`
    <div class="item" onclick="document.getElementById('d-${i}').classList.toggle('show')">
      <div class="row1">
        <div class="rank ${rankClass(i)}">${i+1}</div>
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="mfr">${s.brand||''} · ${s.process||''}工艺</div>
        </div>
        <div class="score">${fmt(s.antutuAI||0)}<small>AI跑分</small></div>
      </div>
      <div class="tags">
        <span class="tag tag-mfr">${s.brand||''}</span>
        <span class="tag tag-proc">${s.process||''}</span>
        <span class="tag tag-gpu">${(s.gpu||'').split(' ')[0]}</span>
      </div>
      <div class="detail" id="d-${i}">
        <div class="d-row"><span class="d-label">厂商</span><span class="d-val">${s.brand||'-'}</span></div>
        <div class="d-row"><span class="d-label">CPU架构</span><span class="d-val">${s.cpu||'-'}</span></div>
        <div class="d-row"><span class="d-label">GPU</span><span class="d-val">${s.gpu||'-'}</span></div>
        <div class="d-row"><span class="d-label">制程工艺</span><span class="d-val">${s.process||'-'}</span></div>
        <div class="d-row"><span class="d-label">Geekbench6 单核</span><span class="d-val">${fmt(s.gb6Single||0)}</span></div>
        <div class="d-row"><span class="d-label">Geekbench6 多核</span><span class="d-val">${fmt(s.gb6Multi||0)}</span></div>
        <div class="d-row"><span class="d-label">简评</span><span class="d-val">${s.note||'-'}</span></div>
      </div>
    </div>
  `).join('');
}

async function loadData(force=false){
  if(!force){
    try{
      const cached=localStorage.getItem(CACHE_KEY);
      if(cached){
        const d=JSON.parse(cached);
        SOCS=d.socs||[];
        if(d.updated)subtitle.textContent=`数据更新于 ${d.updated} · 点击🔄刷新`;
        render();
        return;
      }
    }catch(e){}
  }
  list.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px">正在联网获取最新数据...</div>';
  try{
    const res=await fetch('data/socs.json?t='+Date.now());
    const d=await res.json();
    SOCS=d.socs||[];
    if(d.updated)subtitle.textContent=`数据更新于 ${d.updated} · 点击🔄刷新`;
    localStorage.setItem(CACHE_KEY,JSON.stringify(d));
    render();
  }catch(e){
    try{
      const cached=localStorage.getItem(CACHE_KEY);
      if(cached){
        const d=JSON.parse(cached);
        SOCS=d.socs||[];
        subtitle.textContent=`(离线缓存 ${d.updated||''})`;
        render();
      }else{
        list.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px">加载失败，请检查网络</div>';
      }
    }catch(_){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px">加载失败，请检查网络</div>'}
  }
}

search.addEventListener('input',render);
refreshBtn.addEventListener('click',()=>loadData(true));
loadData();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
