<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>褪色 · FADING</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    height:100%; background:#0a0a14; color:#e8e8f0;
    font-family: -apple-system, "PingFang SC", sans-serif;
    overflow:hidden; touch-action:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #wrap { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#0a0a14;
    box-shadow: 0 0 0 2px #3a3a5e, 0 0 24px rgba(255,107,157,.3);
    border-radius:6px;
  }
  .dpad {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    display:grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px);
    gap:4px;
  }
  .dpad button {
    background:#1a1a2e; border:2px solid #3a3a5e; color:#ffd93d;
    font-size:24px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold;
  }
  .dpad button:active { background:#ff6b9d; color:#0a0a14; }
  .dpad .up { grid-column:2; grid-row:1; }
  .dpad .left { grid-column:1; grid-row:2; }
  .dpad .right { grid-column:3; grid-row:2; }
  .dpad .down { grid-column:2; grid-row:3; }
  .overlay {
    position:absolute; inset:0; background:rgba(10,10,20,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; z-index:10;
  }
  .overlay h2 { font-size:26px; margin-bottom:12px; color:#ffd93d; letter-spacing:4px; }
  .overlay p { font-size:14px; color:#b0b0c8; line-height:1.8; margin-bottom:20px; max-width:320px; }
  .btn {
    background:#ffd93d; color:#1a1a2e; border:none;
    padding:12px 32px; border-radius:10px; font-size:16px; font-weight:bold;
    box-shadow: 0 4px 0 #c9a500; cursor:pointer;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9a500; }
  .back { position:absolute; top:10px; left:10px; color:#8a8aa0; font-size:12px; text-decoration:none; z-index:5; }
</style>
</head>
<body>
<a href="index.html" class="back">← 返回</a>
<div id="wrap">
  <canvas id="game" width="240" height="160"></canvas>
  <div class="dpad" id="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>
  <div id="overlay" class="overlay">
    <h2>褪 色</h2>
    <p>世界的像素正在风化消失。<br>在画面褪成虚无之前，找到金色出口。<br>收集 <span style="color:#6b9dff">墨水</span> 可恢复周围像素。<br>别让你脚下的格子消失！</p>
    <button class="btn" id="startBtn">开始</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 240, H = 160;
const TILE = 16;
const COLS = 15, ROWS = 9;
const HUD_H = 16;
function fit() {
  const pad = 20;
  const availW = window.innerWidth - pad;
  const availH = window.innerHeight - 180;
  const scale = Math.min(availW / W, availH / H, 4);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fit);
fit();
const T = { FLOOR:0, WALL:1, EXIT:2, INK:3, VOID:4 };
let grid = []; let fade = [];
let player = { gx:1, gy:1, px:16, py:16, moving:false };
let level = 1, inkCount = 0, fadeRate = 2.5, running = false;
let message = '', msgTimer = 0, moveSpeed = 4.2, moveProgress = 0;
let fromX=0, fromY=0, toX=0, toY=0;
function genLevel(n) {
  grid = []; fade = [];
  for (let y=0;y<ROWS;y++){ grid[y]=[]; fade[y]=[];
    for (let x=0;x<COLS;x++){
      const border = x===0||y===0||x===COLS-1||y===ROWS-1;
      grid[y][x] = border ? T.WALL : (Math.random()<0.22 ? T.WALL : T.FLOOR);
      fade[y][x] = 100;
    }
  }
  grid[1][1]=T.FLOOR; fade[1][1]=100;
  let ex=COLS-2, ey=ROWS-2;
  for (let i=0;i<30;i++){
    const tx=2+Math.floor(Math.random()*(COLS-4));
    const ty=2+Math.floor(Math.random()*(ROWS-4));
    if (Math.abs(tx-1)+Math.abs(ty-1) > COLS+ROWS-8){ ex=tx; ey=ty; break; }
  }
  grid[ey][ex]=T.EXIT; fade[ey][ex]=100;
  let cx=1, cy=1;
  for (let s=0;s<60;s++){
    grid[cy][cx]= grid[cy][cx]===T.EXIT?T.EXIT:T.FLOOR;
    fade[cy][cx]=100;
    if (cx<ex) cx++; else if (cx>ex) cx--;
    else if (cy<ey) cy++; else if (cy>ey) cy--;
    if (Math.random()<0.3) { if(Math.random()<0.5) cx+=Math.random()<0.5?1:-1; else cy+=Math.random()<0.5?1:-1; }
    cx=Math.max(1,Math.min(COLS-2,cx)); cy=Math.max(1,Math.min(ROWS-2,cy));
  }
  grid[1][1]=T.FLOOR;
  const inks = 2 + n; let placed=0, tries=0;
  while(placed<inks && tries<200){
    tries++;
    const x=1+Math.floor(Math.random()*(COLS-2));
    const y=1+Math.floor(Math.random()*(ROWS-2));
    if (grid[y][x]===T.FLOOR && !(x===1&&y===1)){ grid[y][x]=T.INK; fade[y][x]=100; placed++; }
  }
  player.gx=1; player.gy=1;
  player.px = 1*TILE; player.py = HUD_H + 1*TILE;
  player.moving=false;
  fadeRate = 2.0 + n*1.6;
}
function passable(x,y){
  if (x<0||y<0||x>=COLS||y>=ROWS) return false;
  if (grid[y][x]===T.WALL) return false;
  if (fade[y][x]<=0) return false;
  return true;
}
const keys = { up:false, down:false, left:false, right:false };
function bindBtn(sel, dir){
  const b=document.querySelector(sel);
  const on=e=>{e.preventDefault(); keys[dir]=true;};
  const off=e=>{e.preventDefault(); keys[dir]=false;};
  b.addEventListener('touchstart',on,{passive:false});
  b.addEventListener('touchend',off); b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
}
bindBtn('.up','up'); bindBtn('.down','down'); bindBtn('.left','left'); bindBtn('.right','right');
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp')keys.up=true; if(e.key==='ArrowDown')keys.down=true;
  if(e.key==='ArrowLeft')keys.left=true; if(e.key==='ArrowRight')keys.right=true;
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowUp')keys.up=false; if(e.key==='ArrowDown')keys.down=false;
  if(e.key==='ArrowLeft')keys.left=false; if(e.key==='ArrowRight')keys.right=false;
});
let touchStart=null;
canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY}; },{passive:true});
canvas.addEventListener('touchend', e=>{
  if(!touchStart) return;
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  if (Math.abs(dx)<20 && Math.abs(dy)<20) { touchStart=null; return; }
  if (Math.abs(dx)>Math.abs(dy)){ keys[dx>0?'right':'left']=true; setTimeout(()=>keys[dx>0?'right':'left']=false,120); }
  else { keys[dy>0?'down':'up']=true; setTimeout(()=>keys[dy>0?'down':'up']=false,120); }
  touchStart=null;
},{passive:true});
function startGame(){
  level=1; inkCount=0; message=''; msgTimer=0;
  genLevel(level); running=true;
  document.getElementById('overlay').style.display='none';
}
document.getElementById('startBtn').addEventListener('click', startGame);
function showOverlay(title, body, btnText, action){
  const ov=document.getElementById('overlay');
  ov.innerHTML = `<h2>${title}</h2><p>${body}</p><button class="btn" id="ovBtn">${btnText}</button>`;
  ov.style.display='flex';
  document.getElementById('ovBtn').addEventListener('click', action);
}
function update(dt){
  if(!running) return;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if (grid[y][x]===T.WALL || grid[y][x]===T.EXIT) continue;
    fade[y][x] = Math.max(0, fade[y][x] - fadeRate*dt);
  }
  if (fade[player.gy][player.gx]<=0){
    running=false;
    showOverlay('被虚无吞没', `你脚下的像素彻底消散了…<br>已到达 第 ${level} 层`, '重新开始', startGame);
    return;
  }
  if (!player.moving){
    let dx=0,dy=0;
    if (keys.up) dy=-1; else if(keys.down) dy=1; else if(keys.left) dx=-1; else if(keys.right) dx=1;
    if (dx||dy){
      const nx=player.gx+dx, ny=player.gy+dy;
      if (passable(nx,ny)){
        fromX=player.px; fromY=player.py;
        toX=nx*TILE; toY=HUD_H+ny*TILE;
        player.gx=nx; player.gy=ny;
        player.moving=true; moveProgress=0;
      }
    }
  } else {
    moveProgress += dt*moveSpeed;
    if (moveProgress>=1){
      moveProgress=1; player.moving=false;
      player.px=toX; player.py=toY;
      const cell=grid[player.gy][player.gx];
      if (cell===T.INK){
        grid[player.gy][player.gx]=T.FLOOR; inkCount++;
        for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(grid[y][x]!==T.WALL) fade[y][x]=Math.min(100, fade[y][x]+45);
        message='墨水 +1  像素恢复!'; msgTimer=1.2;
      } else if (cell===T.EXIT){
        if (level>=3){
          running=false;
          showOverlay('逃 出 虚 无', `你穿过了三层消逝的地牢。<br>收集墨水: ${inkCount}<br>在世界彻底褪色之前，你赢了。`, '再玩一次', startGame);
        } else { level++; message=`进入第 ${level} 层`; msgTimer=1.5; genLevel(level); }
      }
    } else {
      const e=ease(moveProgress);
      player.px = fromX + (toX-fromX)*e;
      player.py = fromY + (toY-fromY)*e;
    }
  }
  if (msgTimer>0) msgTimer-=dt;
}
function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function lerpColor(c1,c2,t){
  const p=(h)=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1), b=p(c2);
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
}
function draw(){
  ctx.fillStyle='#0a0a14'; ctx.fillRect(0,0,W,H);
  if (!grid.length) return;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const px=x*TILE, py=HUD_H+y*TILE;
    const t=grid[y][x]; const f=fade[y][x]/100;
    if (t===T.WALL){
      ctx.fillStyle='#2a2a44'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#3a3a5e'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
      ctx.fillStyle='#22223a'; ctx.fillRect(px+2,py+2,3,3);
      ctx.fillRect(px+TILE-5,py+TILE-5,3,3);
    } else {
      const base = t===T.EXIT ? '#ffd93d' : (t===T.INK ? '#8b7355' : '#6b5640');
      const dark = '#1a1a2e', void_ = '#0a0a14';
      let col = f>0.4 ? lerpColor(base, dark, 1-f) : lerpColor(dark, void_, 1-(f/0.4));
      ctx.fillStyle=col; ctx.fillRect(px,py,TILE,TILE);
      if (f>0.5){ ctx.fillStyle = lerpColor('#7a6350', dark, 1-f); ctx.fillRect(px+3,py+3,2,2); ctx.fillRect(px+TILE-6,py+TILE-6,2,2); }
      if (t===T.EXIT){ ctx.fillStyle='#fff4b0'; for(let i=0;i<3;i++) ctx.fillRect(px+3+i*3, py+TILE-4-i*3, TILE-6-i*6, 2); }
      if (t===T.INK){ ctx.fillStyle='#6b9dff'; ctx.fillRect(px+5,py+4,6,9); ctx.fillStyle='#a0c0ff'; ctx.fillRect(px+6,py+3,4,2); ctx.fillStyle='#3a6aa8'; ctx.fillRect(px+5,py+12,6,1); }
    }
  }
  const ppx=Math.round(player.px), ppy=Math.round(player.py);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(ppx+3, ppy+TILE-2, 10, 2);
  ctx.fillStyle='#ff6b9d'; ctx.fillRect(ppx+4, ppy+5, 8, 8);
  ctx.fillStyle='#ff9dc0'; ctx.fillRect(ppx+4, ppy+5, 8, 3);
  ctx.fillStyle='#ffe0c0'; ctx.fillRect(ppx+5, ppy+2, 6, 5);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(ppx+6, ppy+4, 1, 1); ctx.fillRect(ppx+9, ppy+4, 1, 1);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,HUD_H);
  ctx.fillStyle='#3a3a5e'; ctx.fillRect(0,HUD_H-1,W,1);
  ctx.fillStyle='#ffd93d'; ctx.font='bold 9px monospace'; ctx.textBaseline='top';
  ctx.fillText('LV '+level, 4, 4);
  ctx.fillStyle='#6b9dff'; ctx.fillRect(60,5,3,6);
  ctx.fillStyle='#e8e8f0'; ctx.fillText('x'+inkCount, 66, 4);
  const mw=70, mx=W-mw-6;
  ctx.fillStyle='#3a3a5e'; ctx.fillRect(mx,5,mw,6);
  let sum=0,cnt=0;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(grid[y][x]!==T.WALL){sum+=fade[y][x];cnt++;}
  const avg=cnt?sum/cnt:0;
  ctx.fillStyle = avg>50?'#6bd96b':(avg>25?'#ffd93d':'#ff6b6b');
  ctx.fillRect(mx+1,6,(mw-2)*(avg/100),4);
  ctx.fillStyle='#8a8aa0'; ctx.fillText('像素', mx-26, 4);
  if (msgTimer>0 && message){
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(W/2-70, HUD_H+4, 140, 12);
    ctx.fillStyle='#ffd93d'; ctx.textAlign='center'; ctx.fillText(message, W/2, HUD_H+6); ctx.textAlign='left';
  }
}
let last=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
